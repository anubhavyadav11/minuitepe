<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Minuite Pe</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh;
           background:var(--brand-dark); color:white; text-align:center; padding:2rem; }
    .offline-card { max-width:420px; }
    .offline-icon { font-size:5rem; margin-bottom:1.5rem; }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon" aria-hidden="true">📡</div>
    <h1 style="font-size:var(--fs-2xl);margin-bottom:1rem">You're Offline</h1>
    <p style="color:rgba(255,255,255,0.6);font-size:var(--fs-md);line-height:1.7;margin-bottom:2rem">
      No internet connection detected. Check your network and try again, or visit us when you're back online.
    </p>
    <button class="btn btn--food btn--lg" onclick="window.location.reload()">Try Again</button>
    <p style="margin-top:1.5rem;font-size:var(--fs-sm);color:rgba(255,255,255,0.4)">
      For food orders: WhatsApp us at +91 XXXX-XXXXXX
    </p>
  </div>
</body>
</html>
